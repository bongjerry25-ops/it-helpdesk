<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Service</title>
    <style>
        body {
            font-family: 'Khmer OS Battambang', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-size: 22px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #64748b;
            color: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🎯 ស្កែនបង្កើត IT Ticket ថ្មី</h2>
    <form id="ticketForm">
        <div class="form-group">
            <label for="name">ឈ្មោះបុគ្គលិក (Name)</label>
            <input type="text" id="name" placeholder="ឧទាហរណ៍៖ សុខ ជា" required>
        </div>
