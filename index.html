<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div class="logo">
                <img src="logo.png" alt="Logo">
            </div>

            <h1>IT HELPDESK PORTAL</h1>
            <p>Fast • Secure • Professional Support</p>
        </div>

        <form>

            <div class="row">
                <input type="text" placeholder="Staff ID">
                <input type="text" placeholder="Full Name">
            </div>

            <select>
                <option>Select Branch</option>
                <option>Head Office</option>
                <option>Phnom Penh</option>
                <option>Siem Reap</option>
            </select>

            <select>
                <option>Category</option>
                <option>Software Issue</option>
                <option>Hardware Issue</option>
                <option>Network Issue</option>
                <option>Account Issue</option>
            </select>

            <select>
                <option>Issue Type</option>
                <option>Printer</option>
                <option>Microsoft Teams</option>
                <option>Outlook</option>
                <option>Internet</option>
            </select>

            <div class="priority-section">
                <label>Priority</label>

                <div class="priority-options">
                    <label><input type="radio" name="priority"> Low</label>
                    <label><input type="radio" name="priority"> Medium</label>
                    <label><input type="radio" name="priority"> High</label>
                    <label><input type="radio" name="priority"> Critical</label>
                </div>
            </div>

            <textarea placeholder="Describe your issue..."></textarea>

            <div class="upload-box">
                <input type="file">
            </div>

            <button type="submit">
                Submit Ticket
            </button>

        </form>

    </div>

</div>

</body>
</html>
