<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Service - Premium Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-main flex items-center justify-center p-4 sm:p-6">

<div class="card-container">
    
    <div class="flex flex-col items-center text-center mb-6">
        <div class="logo-box">
            <img src="12.png" alt="Banking IT Support Logo">
        </div>
        <h2 class="text-2xl font-bold text-white tracking-wide">IT HELPDESK SERVICE</h2>
        <!-- រកមើលជួរនេះក្នុង index.html រួចប្តូរអក្សរពណ៌មាសមកជាពណ៌បៃតង text-[#008444] -->
        <p class="text-xs uppercase tracking-widest text-[#008444] font-semibold mt-1">E-Ticket Secure Portal</p>
    </div>

    <div class="flex items-center justify-center max-w-xs mx-auto mb-8 text-xs text-slate-400">
        <div class="flex items-center">
            <div class="step-dot step-active">1</div>
            <span class="ml-2 font-medium text-white">បំពេញទម្រង់</span>
        </div>
        <div class="w-12 h-[1px] bg-slate-700 mx-3"></div>
        <div class="flex items-center">
            <div class="step-dot step-inactive">2</div>
            <span class="ml-2 font-medium">IT ដោះស្រាយ</span>
        </div>
    </div>

    <form id="ticketForm" class="space-y-5">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label for="staff_id" class="input-label">អត្តសញ្ញាណប័ណ្ណបុគ្គលិក (Staff ID)</label>
                <input type="text" id="staff_id" placeholder="ឧទាហរណ៍៖ 01234" required class="input-field">
            </div>
            <div class="flex flex-col">
                <label for="name" class="input-label">ឈ្មោះពេញ (Full Name)</label>
                <input type="text" id="name" placeholder="ឧទាហរណ៍៖ Min Pheap" required class="input-field">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col">
                <label for="department" class="input-label">ផ្នែក / សាខាធនាគារ (Department/Branch)</label>
                <select id="department" required class="select-field">
                    <option value="" class="bg-[#0f172a]">-- សូមជ្រើសរើសសាខា --</option>
                    <option value="HQ - Credit & Loan" class="bg-[#0f172a]">ការិយាល័យកណ្តាល - ផ្នែកឥណទាន</option>
                    <option value="HQ - Trade Finance" class="bg-[#0f172a]">ការិយាល័យកណ្តាល - ហិរញ្ញប្បទានពាណិជ្ជកម្ម</option>
                    <option value="Branch - Tuol Kouk" class="bg-[#0f172a]">សាខា - ទួលគោក</option>
                    <option value="Branch - Olympic" class="bg-[#0f172a]">សាខា - អូឡាំពិក</option>
                    <option value="Branch - Siem Reap" class="bg-[#0f172a]">សាខា - ខេត្តសៀមរាប</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label for="phone" class="input-label">លេខទូរស័ព្ទផ្ទាល់ខ្លួន (Phone Number)</label>
                <input type="tel" id="phone" placeholder="ឧទាហរណ៍៖ 012345678" required class="input-field">
            </div>
        </div>

        <div class="flex flex-col">
            <label for="issue_type" class="input-label">ប្រភេទបញ្ហាធំ (Issue Type)</label>
            <select id="issue_type" required class="select-field">
                <option value="" class="bg-[#0f172a]">-- សូមជ្រើសរើសប្រភេទបញ្ហា --</option>
                <option value="Software" class="bg-[#0f172a]">បញ្ហាកម្មវិធី / ប្រព័ន្ធធនាគារ (Software)</option>
                <option value="Hardware" class="bg-[#0f172a]">បញ្ហាគ្រឿងម៉ាស៊ីន / ឧបករណ៍ (Hardware)</option>
            </select>
        </div>

        <div id="sub_category_area" class="flex flex-col hidden">
            <label for="sub_issue" class="input-label">ពិពណ៌នាបញ្ហាច្បាស់លាស់ (Issue Detail)</label>
            <select id="sub_issue" class="select-field"></select>
        </div>

        <!-- Row 4.5: SLA Priority (កម្រិតអាទិភាព) -->
        <div class="flex flex-col">
            <label for="sla_priority" class="input-label">កម្រិតអាទិភាព (SLA Priority)</label>
            <select id="sla_priority" required class="select-field transition-colors duration-300">
                <option value="" class="bg-[#0f172a] text-white">-- សូមជ្រើសរើសកម្រិតអាទិភាព --</option>
                <option value="High" class="bg-[#0f172a] text-red-500 font-bold">🔴 ខ្ពស់ (High)</option>
                <option value="Medium" class="bg-[#0f172a] text-yellow-500 font-bold">🟡 មធ្យម (Medium)</option>
                <option value="Low" class="bg-[#0f172a] text-gray-500 font-bold">⚫ ទាប (Low)</option>
            </select>
        </div>

        <div class="flex flex-col">
            <label for="description" class="input-label">ការពិពណ៌នាបន្ថែម (Description)</label>
            <textarea id="description" placeholder="សូមរៀបរាប់ពីបញ្ហាបច្ចេកទេសនៅទីនេះ..." required class="textarea-field"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
            Summit Ticket
        </button>
    </form>
</div>

<script src="app.js"></script>
</body>
</html>
