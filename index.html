<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - Premium Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-[#0f172a] transition-colors duration-300 flex items-center justify-center min-h-screen p-4 sm:p-6">

<div class="card-container">
    <!-- Theme Toggle -->
    <div class="flex justify-end mb-2">
        <button id="themeToggle" class="px-3 py-1 bg-slate-700 text-white text-xs rounded-lg hover:bg-slate-600 transition">
            🌓 ប្តូរពណ៌ (Theme)
        </button>
    </div>

    <div class="flex flex-col items-center text-center mb-8">
        <div class="logo-box">
            <img src="12.png" alt="IT Support Logo">
        </div>
        <h2 class="text-2xl font-bold text-white tracking-wide mt-3">IT HELPDESK SERVICE</h2>
        <p class="text-xs uppercase tracking-widest text-[#008444] font-semibold mt-1">E-Ticket Secure Portal</p>
    </div>

    <!-- Steps -->
    <div class="flex items-center justify-center max-w-xs mx-auto mb-8 text-xs text-slate-400">
        <div class="flex items-center"><div class="step-dot step-active">1</div><span class="ml-2 font-medium text-white">បំពេញទម្រង់</span></div>
        <div class="w-12 h-[1px] bg-slate-700 mx-3"></div>
        <div class="flex items-center"><div class="step-dot step-inactive">2</div><span class="ml-2 font-medium">IT ដោះស្រាយ</span></div>
    </div>

    <form id="ticketForm" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col"><label class="input-label">អត្តសញ្ញាណប័ណ្ណបុគ្គលិក</label><input type="text" id="staff_id" required class="input-field"></div>
            <div class="flex flex-col"><label class="input-label">ឈ្មោះពេញ</label><input type="text" id="name" required class="input-field"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col"><label class="input-label">ផ្នែក / សាខា</label><select id="department" required class="select-field"><option value="">-- សូមជ្រើសរើសសាខា --</option><option value="HQ - Credit & Loan">ការិយាល័យកណ្តាល</option><option value="Branch - Tuol Kouk">សាខា - ទួលគោក</option></select></div>
            <div class="flex flex-col"><label class="input-label">លេខទូរស័ព្ទ</label><input type="tel" id="phone" required class="input-field"></div>
        </div>

        <div class="flex flex-col"><label class="input-label">ប្រភេទបញ្ហា</label><select id="issue_type" required class="select-field"><option value="">-- សូមជ្រើសរើស --</option><option value="Software">Software</option><option value="Hardware">Hardware</option></select></div>
        <div id="sub_category_area" class="flex flex-col hidden"><label class="input-label">ពិពណ៌នាបញ្ហាច្បាស់លាស់</label><select id="sub_issue" class="select-field"></select></div>
        <div class="flex flex-col"><label class="input-label">កម្រិតអាទិភាព</label><select id="sla_priority" required class="select-field"><option value="High">ខ្ពស់ (High)</option><option value="Medium">មធ្យម (Medium)</option><option value="Low">ទាប (Low)</option></select></div>
        <div class="flex flex-col"><label class="input-label">ការពិពណ៌នាបន្ថែម</label><textarea id="description" required class="textarea-field" rows="3"></textarea></div>

        <div class="flex flex-col mt-4">
    <label class="input-label mb-2">ឯកសារភ្ជាប់ (Attach Screenshot / Log)</label>
    <div class="relative">
        <input type="file" id="file_attachment" class="hidden" onchange="updateFileName(this)">
        <label for="file_attachment" class="upload-btn cursor-pointer flex items-center justify-center gap-2 border-2 border-dashed border-slate-600 dark:border-slate-500 rounded-xl py-3 text-sm text-slate-400 hover:border-blue-500 transition-all">
            <span id="fileNameDisplay">📎 ចុចដើម្បីជ្រើសរើសឯកសារ</span>
        </label>
    </div>
</div>

<script>
    // មុខងារបង្ហាញឈ្មោះឯកសារពេល Upload ជាប់
    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files.length > 0) {
            display.innerText = "✅ " + input.files[0].name;
        } else {
            display.innerText = "📎 ចុចដើម្បីជ្រើសរើសឯកសារ";
        }
    }
</script>

        <button type="submit" id="submitBtn" class="submit-btn">បញ្ជូនសំណើរ (Submit Ticket)</button>
    </form>
</div>

<script>
    // Theme Switch Logic
    document.getElementById('themeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
    });

    // រក្សាទុក Logic ដើមរបស់បងទាំងអស់នៅទីនេះ...
    const issueTypeSelect = document.getElementById("issue_type");
    const subCategoryArea = document.getElementById("sub_category_area");
    const subIssueSelect = document.getElementById("sub_issue");
    const subCategories = { "Software": ["Email", "Core Banking", "Windows"], "Hardware": ["PC", "Printer", "Network"] };

    issueTypeSelect.addEventListener("change", function() {
        if (this.value && subCategories[this.value]) {
            subCategoryArea.classList.remove("hidden");
            subIssueSelect.innerHTML = subCategories[this.value].map(i => `<option value="${i}">${i}</option>`).join('');
        } else { subCategoryArea.classList.add("hidden"); }
    });
</script>
</body>
</html>
