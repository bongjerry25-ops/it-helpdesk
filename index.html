<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - Premium Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        // Tailwind Dark Mode Config
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-[#f5f7fa] dark:bg-[#0f172a] transition-colors duration-300 flex items-center justify-center min-h-screen p-4 sm:p-6">

<div class="card-container w-full max-w-2xl bg-white dark:bg-[#1e293b] p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700">
    
    <!-- Theme Toggle Button -->
    <div class="flex justify-end mb-4">
        <button id="themeToggle" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-full text-xs font-bold text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform">
            🌓 ប្តូរពណ៌ (Theme)
        </button>
    </div>

    <div class="flex flex-col items-center text-center mb-8">
        <div class="logo-box bg-white p-2 rounded-full shadow-lg">
            <img src="12.png" alt="IT Support Logo" class="w-16 h-16">
        </div>
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white tracking-wide mt-3">IT HELPDESK SERVICE</h2>
        <p class="text-xs uppercase tracking-widest text-[#008444] font-semibold mt-1">E-Ticket Secure Portal</p>
    </div>

    <form id="ticketForm" class="space-y-5">
        <!-- Fields (រក្សាទុក Form ដើមរបស់បង) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <input type="text" id="staff_id" placeholder="Staff ID" required class="input-field">
            <input type="text" id="name" placeholder="Full Name" required class="input-field">
        </div>
        
        <select id="department" required class="select-field">
            <option value="">-- សូមជ្រើសរើសសាខា --</option>
            <option value="HQ - Credit & Loan">ការិយាល័យកណ្តាល - ផ្នែកឥណទាន</option>
            <option value="Branch - Tuol Kouk">សាខា - ទួលគោក</option>
        </select>

        <select id="issue_type" required class="select-field">
            <option value="">-- សូមជ្រើសរើសប្រភេទបញ្ហា --</option>
            <option value="Software">បញ្ហាកម្មវិធី (Software)</option>
            <option value="Hardware">បញ្ហាគ្រឿងម៉ាស៊ីន (Hardware)</option>
        </select>

        <div id="sub_category_area" class="hidden">
            <select id="sub_issue" class="select-field"></select>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">
            បញ្ជូនសំណើរ (Submit Ticket)
        </button>
    </form>
</div>

<script>
    // Theme Toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    });

    // Load saved theme
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    // Logic បងដដែល (រក្សាទុកឱ្យនៅដដែល)
    // ... (កូដ Telegram Fetch របស់បងនៅទីនេះ) ...
</script>
</body>
</html>
