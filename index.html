<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise IT Ticket</title>
    <!-- នាំចូល Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Khmer OS Battambang', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a; /* ពណ៌ផ្ទៃក្រោយខៀវស្រងាត់ */
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #1e293b;
            border: 1px solid #38bdf8; /* បន្ទាត់ជុំវិញពណ៌ខៀវខ្ចី */
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🎯 បង្កើត IT Ticket ថ្មី</h2>
    
    <form id="ticketForm">
        <!-- ប្រអប់បញ្ចូលឈ្មោះ -->
        <div class="form-group">
            <label for="name">ឈ្មោះបុគ្គលិក (Name)</label>
            <input type="text" id="name" placeholder="ឧទាហរណ៍៖ សុខ ជា" required>
        </div>

        <!-- ប្រអប់ជ្រើសរើសផ្នែក -->
        <div class="form-group">
            <label for="department">ផ្នែក / នាយកដ្ឋាន (Department)</label>
            <select id="department" required>
                <option value="">-- សូមជ្រើសរើសផ្នែក --</option>
                <option value="HR">ធនធានមនុស្ស (HR)</option>
                <option value="Finance">ហិរញ្ញវត្ថុ (Finance)</option>
                <option value="Operations">ប្រតិបត្តិការ (Operations)</option>
                <option value="Sales">លក់ និងទីផ្សារ (Sales)</option>
                <option value="Other">ផ្សេងៗ (Other)</option>
            </select>
        </div>

        <!-- ប្រអប់ជ្រើសរើសប្រភេទបញ្ហា -->
        <div class="form-group">
            <label for="issue_type">ប្រភេទបញ្ហា (Issue Type)</label>
            <select id="issue_type" required>
                <option value="">-- សូមជ្រើសរើសបញ្ហា --</option>
                <option value="Hardware">បញ្ហាគ្រឿងម៉ាស៊ីន (Hardware)</option>
                <option value="Software">បញ្ហាកម្មវិធី (Software)</option>
                <option value="Network">បញ្ហាអ៊ីនធឺណិត (Network)</option>
                <option value="Account/Password">គណនី ឬ ពាក្យសម្ងាត់</option>
            </select>
        </div>

        <!-- ប្រអប់ពិពណ៌នាបញ្ហា -->
        <div class="form-group">
            <label for="description">ការពិពណ៌នាបន្ថែម (Description)</label>
            <textarea id="description" placeholder="សូមរៀបរាប់ពីបញ្ហារបស់អ្នកនៅទីនេះ..." required></textarea>
        </div>

        <!-- ប៊ូតុង Submit -->
        <button type="submit">ផ្ញើព័ត៌មាន (Submit)</button>
    </form>
</div>

<script>
    // ចាប់ផ្តើមទាញយកប្រព័ន្ធ Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.ready(); // ជូនដំណឹងទៅ Telegram ថាទំព័រលោតចប់ហើយ
    tg.expand(); // ពង្រីកអេក្រង់ WebApp ឱ្យធំពេញល្មមស្អាត

    // ចាប់យកព្រឹត្តិការណ៍នៅពេលចុចប៊ូតុង Submit លើ Form
    document.getElementById("ticketForm").addEventListener("submit", function(e) {
        e.preventDefault(); // ការពារកុំឱ្យវា Refresh ទំព័រ Website

        // ប្រមូលផ្តុំទិន្នន័យពី Form ទៅជាវត្ថុ (Object)
        const formData = {
            name: document.getElementById("name").value,
            department: document.getElementById("department").value,
            issue_type: document.getElementById("issue_type").value,
            description: document.getElementById("description").value
        };

        // 🎯 ផ្ញើទិន្នន័យជា JSON ត្រឡប់ទៅកាន់ Bot នៅក្នុង Telegram វិញ
        tg.sendData(JSON.stringify(formData));

        // 🎯 លោតសារ Alert ជូនដំណឹង និងបញ្ជាឱ្យបិទផ្ទាំង WebApp ភ្លាមៗ
        alert("សំបុត្រកិច្ចការ (Ticket) របស់អ្នកត្រូវបានផ្ញើជោគជ័យ!");
        tg.close(); 
    });
</script>

</body>
</html>
