<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

<div class="card-container">
    <div class="text-center mb-8">
        <div class="logo-box"><img src="12.png" alt="Logo"></div>
        <h1 class="text-2xl font-bold text-white mt-2">IT HELPDESK PORTAL</h1>
        <p class="text-blue-400 text-sm tracking-widest uppercase">Fast • Secure • Professional</p>
    </div>

    <form id="ticketForm" class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
            <input type="text" placeholder="Staff ID" class="input-field" required>
            <input type="text" placeholder="Full Name" class="input-field" required>
        </div>

        <select class="input-field w-full">
            <option>🏢 Select Branch/Department</option>
            <option>HQ - Credit & Loan</option>
            <option>Branch - Tuol Kouk</option>
        </select>

        <select id="cat" class="input-field w-full">
            <option>📂 Select Category</option>
            <option value="Software">Software</option>
            <option value="Hardware">Hardware</option>
        </select>

        <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
            <label class="block text-slate-400 text-xs mb-2">PRIORITY</label>
            <div class="flex gap-2">
                <label class="priority-radio"><input type="radio" name="prio" value="low"> Low</label>
                <label class="priority-radio"><input type="radio" name="prio" value="med"> Med</label>
                <label class="priority-radio"><input type="radio" name="prio" value="high"> High</label>
                <label class="priority-radio"><input type="radio" name="prio" value="crit"> Critical</label>
            </div>
        </div>

        <textarea placeholder="Describe your issue..." class="input-field w-full h-24" required></textarea>

        <label class="upload-btn">
            📎 Attach Screenshot / Error Log
            <input type="file" class="hidden">
        </label>

        <button type="submit" class="submit-btn">Submit Support Ticket</button>
    </form>
</div>
</body>
</html>
